name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Unzip, Install and Build
        run: |
          unzip -o fruit-ninja-auto-bot.zip -d ./extracted
          TARGET_DIR=$(find ./extracted -name "package.json" -exec dirname {} \;)
          cd "$TARGET_DIR"
          
          bun install
          bunx vite build
          bunx @capacitor/cli add android || true
          bunx @capacitor/cli sync android
          
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fruit-ninja-bot-apk
          path: '**/android/app/build/outputs/apk/debug/app-debug.apk'
