name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup and Build Project
        run: |
          unzip -o fruit-ninja-auto-bot.zip -d ./extracted
          
          # البحث عن مجلد المشروع وإزالة node_modules من كل مكان نهائياً
          TARGET_DIR=$(find ./extracted -name "package.json" -exec dirname {} \;)
          find . -name "node_modules" -type d -exec rm -rf {} +
          find . -name "package-lock.json" -type f -delete
          
          # التثبيت والبناء داخل مجلد المشروع المكتشف
          cd "$TARGET_DIR"
          npm install --force
          npx vite build
          npx cap add android || true
          npx cap sync android
          
          # بناء APK
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fruit-ninja-bot-apk
          path: '**/android/app/build/outputs/apk/debug/app-debug.apk'
